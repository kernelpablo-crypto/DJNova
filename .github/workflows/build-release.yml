name: Tests & Release Builds (Linux + Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pyqt5 python3-gi gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            python3-pytest python3-appdirs python3-sortedcontainers \
            python3-falcon python3-mido python3-numpy python3-pil \
            ffmpeg

      - name: Instalar dependencias Python extras
        run: pip3 install --break-system-packages qrcode python-osc python-rtmidi

      - name: Ejecutar suite de pruebas DJNova
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v tests/

      - name: Empaquetar release portable Linux (.tar.gz)
        run: |
          mkdir -p dist/DJNova-Linux
          cp -r lisp assets djnova.py LICENSE README.md SECURITY.md packaging dist/DJNova-Linux/
          tar -C dist -czf dist/DJNova-Linux-x86_64.tar.gz DJNova-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: DJNova-Linux
          path: dist/DJNova-Linux-x86_64.tar.gz

  build-appimage:
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema para AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-pyqt5 python3-gi \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            python3-appdirs python3-sortedcontainers python3-falcon \
            python3-mido python3-numpy python3-pil curl desktop-file-utils

      - name: Instalar PyInstaller y módulos Python
        run: pip3 install --break-system-packages --no-cache-dir pyinstaller qrcode python-osc python-rtmidi

      - name: Construir DJNova-x86_64.AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/DJNova-x86_64.AppImage --help

      - uses: actions/upload-artifact@v4
        with:
          name: DJNova-AppImage
          path: dist/DJNova-x86_64.AppImage

  build-flatpak:
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar flatpak y flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils

      - name: Configurar Flathub e instalar runtime KDE + PyQt5
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Platform//5.15-24.08 \
            org.kde.Sdk//5.15-24.08 \
            com.riverbankcomputing.PyQt.BaseApp//5.15-24.08

      - name: Construir bundle DJNova-x86_64.flatpak
        run: |
          mkdir -p dist
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak \
            packaging/flatpak/io.github.kernelpablo_crypto.DJNova.yml
          flatpak build-bundle flatpak-repo dist/DJNova-x86_64.flatpak \
            io.github.kernelpablo_crypto.DJNova

      - uses: actions/upload-artifact@v4
        with:
          name: DJNova-Flatpak
          path: dist/DJNova-x86_64.flatpak

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pyqt5
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Instalar paquetes Python y PyInstaller
        run: |
          pip install --break-system-packages --no-cache-dir pyinstaller appdirs sortedcontainers falcon mido python-osc qrcode
          pip install --break-system-packages --no-cache-dir python-rtmidi || echo "python-rtmidi opcional omitido en Win64"

      - name: Compilar DJNova.exe con PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/windows/djnova.spec

      - name: Generar instalador DJNova-Setup-Win64.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          Compress-Archive -Path dist\DJNova -DestinationPath dist\DJNova-Portable-Win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DJNova-Windows-Win64
          path: |
            dist/DJNova-Setup-*.exe
            dist/DJNova-Portable-Win64.zip

  publish-release:
    needs: [test-linux, build-appimage, build-flatpak, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

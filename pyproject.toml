[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djnova"
version = "1.0.0"
description = "DJNova — Consola DJ, AutoDJ, Radio Streaming, Escenario Video y Broadcast (basado en Linux Show Player)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "appdirs>=1.4.4",
    "sortedcontainers>=2.4.0",
    "falcon>=3.1.0",
    "mido>=1.2.10",
    "python-rtmidi>=1.5.0",
    "python-osc>=1.8.0",
    "PyQt5>=5.15.9",
    "PyGObject>=3.44.0",
    "numpy>=1.24.0",
    "qrcode>=7.4.2",
    "Pillow>=10.0.0",
]

[project.scripts]
djnova = "lisp.main:main"

[tool.setuptools.packages.find]
include = ["lisp*"]
